name: Build FPVCineCam32

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/firmware/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32c3_supermini

      - name: Prepare web flasher binaries
        run: |
          mkdir -p docs/firmware
          cp .pio/build/esp32c3_supermini/firmware.bin docs/firmware/firmware.bin
          cp .pio/build/esp32c3_supermini/bootloader.bin docs/firmware/bootloader.bin
          cp .pio/build/esp32c3_supermini/partitions.bin docs/firmware/partitions.bin
          find ~/.platformio -name boot_app0.bin -print -quit | xargs -I{} cp {} docs/firmware/boot_app0.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPVCineCam32-firmware
          path: docs/firmware/

      - name: Commit firmware for web installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/
          if git diff --cached --quiet; then
            echo "No firmware changes to commit."
            exit 0
          fi
          git commit -m "Build FPVCineCam32 firmware"
          git pull --rebase origin main
          git push origin main
